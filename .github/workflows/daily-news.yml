name: Daily News EPUB

on:
  schedule:
    # 07:00 Moscow = 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate EPUB and OPDS
        run: python3 generate_news_epub.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.epub opds.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
