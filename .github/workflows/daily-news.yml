name: Daily Tech Digest EPUB

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manual-tech-trigger.txt"
      - "tech_digest.json"
      - "generate_digest_epub.py"

permissions:
  contents: write

concurrency:
  group: x3-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate clean narrated EPUB and OPDS
        run: python3 generate_digest_epub.py

      - name: Verify generated catalog and EPUB
        run: |
          test -s latest.epub
          test -s opds.xml
          python3 -m zipfile -t latest.epub
          grep -q "latest.epub" opds.xml
          echo "Digest verification OK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.epub opds.xml *.epub tech_digest.json generate_digest_epub.py
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update narrated tech digest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
          fi
