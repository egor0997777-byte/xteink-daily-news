name: Daily News EPUB

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate EPUB and OPDS
        run: python3 generate_news_epub.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch habr-*.epub lifehacker.epub vc.epub ixbt.epub 3dnews.epub tproger.epub dtf.epub opds-*.xml 2>/dev/null || true
          git add *.epub opds.xml generate_news_epub.py
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
