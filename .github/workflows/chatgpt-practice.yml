name: ChatGPT Practice X3 EPUB

on:
  push:
    branches:
      - main
    paths:
      - "chatgpt/input.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x3-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ChatGPT Practice EPUB and OPDS
        run: python3 generate_chatgpt_epub.py

      - name: Validate EPUB and OPDS
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          data = json.loads(Path("chatgpt/input.json").read_text(encoding="utf-8"))
          issue_date = data["date"]
          epub = Path(f"chatgpt-{issue_date}.epub")
          assert epub.exists() and epub.stat().st_size > 1000, "EPUB missing or unexpectedly small"
          with zipfile.ZipFile(epub) as zf:
              names = zf.namelist()
              assert names and names[0] == "mimetype"
              assert zf.read("mimetype") == b"application/epub+zip"
              assert zf.getinfo("mimetype").compress_type == zipfile.ZIP_STORED
              for name in ("META-INF/container.xml", "OEBPS/content.opf", "OEBPS/toc.ncx", "OEBPS/content.xhtml"):
                  assert name in names
                  ET.fromstring(zf.read(name))
          ET.parse("opds-chatgpt.xml")
          latest = Path("chatgpt-latest.epub")
          assert latest.exists() and latest.read_bytes() == epub.read_bytes()
          print(f"Validated {epub} ({epub.stat().st_size} bytes)")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chatgpt-*.epub opds-chatgpt.xml
          if git diff --staged --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update ChatGPT Practice X3 issue $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
          fi
