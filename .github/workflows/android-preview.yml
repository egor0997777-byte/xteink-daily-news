name: Android Preview

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: android-meter-app
  APK_PATH: android-meter-app/app/build/outputs/apk/debug/app-debug.apk
  PACKAGE_NAME: ru.egor.meters
  MAIN_ACTIVITY: .OcrMainActivity

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator and capture UI flow
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            ARTIFACTS="$GITHUB_WORKSPACE/android-preview-artifacts"
            UI_XML="$GITHUB_WORKSPACE/window.xml"
            mkdir -p "$ARTIFACTS"

            screenshot() {
              sleep 1
              adb exec-out screencap -p > "$ARTIFACTS/$1"
            }

            tap_text() {
              local wanted="$1"
              adb shell uiautomator dump --compressed /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$UI_XML" >/dev/null
              local point
              point=$(python3 - "$wanted" "$UI_XML" <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET

            wanted, path = sys.argv[1], sys.argv[2]
            root = ET.parse(path).getroot()
            candidates = []
            for node in root.iter('node'):
                text = node.attrib.get('text', '')
                desc = node.attrib.get('content-desc', '')
                if text == wanted or desc == wanted:
                    candidates.append(node)
            if not candidates:
                print(f'UI element not found: {wanted}', file=sys.stderr)
                sys.exit(2)
            bounds = candidates[0].attrib.get('bounds', '')
            nums = list(map(int, re.findall(r'\d+', bounds)))
            if len(nums) != 4:
                print(f'Bad bounds for {wanted}: {bounds}', file=sys.stderr)
                sys.exit(3)
            x = (nums[0] + nums[2]) // 2
            y = (nums[1] + nums[3]) // 2
            print(x, y)
            PY
              )
              read -r x y <<< "$point"
              adb shell input tap "$x" "$y"
              sleep 1
            }

            adb install -r "$GITHUB_WORKSPACE/${APK_PATH}"
            adb shell pm clear "$PACKAGE_NAME" >/dev/null
            adb shell am start -W -n "$PACKAGE_NAME/$PACKAGE_NAME$MAIN_ACTIVITY"
            screenshot "01-home-empty.png"

            tap_text "Добавить адрес"
            screenshot "02-add-address-dialog.png"

            tap_text "Название или адрес"
            adb shell input text Home
            sleep 1
            tap_text "Добавить"
            screenshot "03-home-with-address.png"

            tap_text "Home"
            screenshot "04-address-empty.png"

            tap_text "Добавить счётчик"
            screenshot "05-add-meter-dialog.png"

            tap_text "Добавить"
            screenshot "06-address-with-meter.png"

            tap_text "Холодная вода"
            screenshot "07-meter-empty.png"

            tap_text "Новое показание"
            screenshot "08-add-reading-dialog.png"

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-screenshots
          path: android-preview-artifacts/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
